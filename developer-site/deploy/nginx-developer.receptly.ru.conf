# ============================================================
# developer.receptly.ru — статический персональный сайт
# Положить в /etc/nginx/sites-available/developer.receptly.ru
# и включить:
#   sudo ln -s /etc/nginx/sites-available/developer.receptly.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS добавит certbot:
#   sudo certbot --nginx -d developer.receptly.ru
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name developer.receptly.ru;

    root /var/www/developer;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Кэш статики: шрифты и js/css у нас версионируются редко
    location ~* \.(css|js|woff2|svg|png|jpg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Безопасность. CSP строгий — работает, потому что все ассеты self-hosted
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

    # Не отдаём служебное
    location ~ /\.(git|ht) { deny all; }
    location = /get-assets.sh { deny all; }
    location = /README.md { deny all; }
    location ^~ /deploy/ { deny all; }

    access_log /var/log/nginx/developer.receptly.ru.access.log;
    error_log  /var/log/nginx/developer.receptly.ru.error.log;
}
